<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extsecurity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>WatchTower</h1>

      <div class="mode-selector">
        <label class="radio-label">
          <input type="radio" name="mode" value="auto" checked />
          <span>Detect Automatically</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="mode" value="manual" />
          <span>Paste Content</span>
        </label>
      </div>

      <div id="manualSection" style="display: none">
        <textarea
          id="inputText"
          placeholder="Paste your text content here..."
        ></textarea>
        <button type="submit" id="analyzeButton">Analyze Text</button>
      </div>

      <div id="autoSection">
        <button type="button" id="autoAnalyzeButton">
          Analyze Current Email
        </button>
      </div>

      <p id="status"></p>
    </main>
  </body>
  <script src="dist/popup.js"></script>
</html>
